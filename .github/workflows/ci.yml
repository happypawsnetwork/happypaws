name: CI

on:
  push:
    branches: ["main", "staging"]
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - "apps/docs/**"
      - "docs/**"
      - "diagrams/**"
      - ".gitignore"
  pull_request:
    branches: ["main", "staging"]
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - "apps/docs/**"
      - "docs/**"
      - "diagrams/**"
      - ".gitignore"

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'shared/**'
            web:
              - 'apps/web/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            mobile:
              - 'apps/mobile/**'

  validate-api:
    name: Validate API (.NET 10)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run API tests
        run: dotnet test apps/api/HappyPaws.slnx --configuration Release

      - name: Build API
        run: dotnet build apps/api/HappyPaws.slnx --configuration Release

  validate-web:
    name: Validate Web (Next.js 16)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm --filter web lint

      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy_ci_key
        run: pnpm --filter web build

  validate-mobile:
    name: Validate Mobile (Flutter 3.47)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Create mobile stub environment
        working-directory: apps/mobile
        run: |
          cat <<EOF > .env
          API_BASE_URL=http://localhost:5000
          GOOGLE_MAPS_API_KEY=dummy_ci_key
          EOF

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Mobile tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Mobile (Android Debug APK)
        working-directory: apps/mobile
        run: flutter build apk --debug
