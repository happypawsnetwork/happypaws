name: CI

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

jobs:
  validate:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Create mobile stub environment
        working-directory: apps/mobile
        run: |
          cat <<EOF > .env
          API_BASE_URL=http://localhost:5000
          GOOGLE_MAPS_API_KEY=dummy_ci_key
          EOF

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install Node dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint:all

      - name: Run API tests
        run: dotnet test apps/api/HappyPaws.slnx --configuration Release

      - name: Run Mobile tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build API and Web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy_ci_key
        run: |
          pnpm --filter api build
          pnpm --filter web build

      - name: Build Mobile (Android Debug APK)
        working-directory: apps/mobile
        run: flutter build apk --debug
